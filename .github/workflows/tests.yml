name: StreamForge Tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/distributed-system-completion

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Start Kafka
        run: docker compose -f docker/compose.yaml up -d kafka kafka-init

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if nc -z localhost 9092; then
              echo "Kafka is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Kafka did not become ready"
          docker compose -f docker/compose.yaml ps
          docker compose -f docker/compose.yaml logs kafka
          exit 1

      - name: Start FastAPI backend
        run: |
          nohup python -m uvicorn streamforge.main:app --host 127.0.0.1 --port 8000 > /tmp/streamforge-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "FastAPI is ready"
              exit 0
            fi
            sleep 2
          done
          echo "FastAPI did not become ready"
          cat /tmp/streamforge-api.log
          exit 1

      - name: Run tests
        run: pytest -q

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker/compose.yaml down
          if [ -f /tmp/streamforge-api.log ]; then
            cat /tmp/streamforge-api.log
          fi
